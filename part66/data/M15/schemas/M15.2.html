<div id="schema-m1502-wrap" style="font-family: inherit; max-width: 640px; margin: 0.6em 0 0.2em;">
<style>
#schema-m1502-wrap .m1502-btn { margin:4px 6px 4px 0; padding:8px 14px; border-radius:6px; border:1px solid #888; background:#f4f4f4; color:#222; cursor:pointer; font-size:0.9em; }
#schema-m1502-wrap .m1502-btn.active { background:#fff3b0; border-color:#e0a800; }
#schema-m1502-wrap .m1502-row { display:flex; align-items:center; gap:10px; margin-top:14px; }
#schema-m1502-wrap .m1502-label { flex:0 0 90px; font-size:0.82em; }
#schema-m1502-wrap .m1502-track { flex:1; height:22px; border-radius:4px; background:#e8e8e8; position:relative; overflow:hidden; border:1px solid #ccc; }
#schema-m1502-wrap .m1502-fill { height:100%; background:#7fa8d9; transition: width 0.4s; }
#schema-m1502-wrap .m1502-shape { margin-top:16px; height:60px; position:relative; background:linear-gradient(to right, #d8e6f5, #d8e6f5); border:1px solid #aaa; border-radius:4px; overflow:hidden; }
#schema-m1502-wrap .m1502-cone { position:absolute; top:0; bottom:0; left:0; width:100%; background: linear-gradient(to right, rgba(127,168,217,0.05), rgba(127,168,217,0.35)); clip-path: polygon(0% 35%, 100% 5%, 100% 95%, 0% 65%); }
#schema-m1502-wrap .m1502-caption { margin-top:14px; padding:10px; border-left:4px solid #888; background:rgba(128,128,128,0.10); border-radius:4px; min-height:4.5em; }
</style>

<p><strong>Le diffuseur :</strong> observez ce qui se passe pour la vitesse et la pression de l'air en traversant un conduit qui s'élargit.</p>

<div>
  <button class="m1502-btn active" data-t="entree">Entrée du diffuseur</button>
  <button class="m1502-btn" data-t="sortie">Sortie du diffuseur</button>
</div>

<div class="m1502-shape"><div class="m1502-cone"></div></div>

<div class="m1502-row"><div class="m1502-label">Vitesse</div><div class="m1502-track"><div class="m1502-fill" id="m1502-vit" style="width:90%; background:#c0392b;"></div></div></div>
<div class="m1502-row"><div class="m1502-label">Pression</div><div class="m1502-track"><div class="m1502-fill" id="m1502-pre" style="width:30%; background:#7fbf7f;"></div></div></div>

<div class="m1502-caption" id="m1502-caption">Entrée du diffuseur (côté étroit) : l'air arrive à une vitesse élevée et une pression modeste.</div>
</div>

<script>
(function () {
  var wrap = document.getElementById('schema-m1502-wrap');
  if (!wrap) { return; }
  var btns = wrap.querySelectorAll('.m1502-btn');
  var vit = wrap.querySelector('#m1502-vit');
  var pre = wrap.querySelector('#m1502-pre');
  var caption = wrap.querySelector('#m1502-caption');

  function render(t) {
    btns.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-t') === t); });
    if (t === 'entree') {
      vit.style.width = '90%'; pre.style.width = '30%';
      caption.textContent = "Entrée du diffuseur (côté étroit) : l'air arrive à une vitesse élevée et une pression modeste.";
    } else {
      vit.style.width = '35%'; pre.style.width = '80%';
      caption.textContent = "Sortie du diffuseur (côté large, vers le compresseur) : la vitesse a diminué et la pression a augmenté — sans aucune pièce mobile, juste par l'élargissement progressif du conduit.";
    }
  }

  btns.forEach(function (b) {
    b.addEventListener('click', function () { render(b.getAttribute('data-t')); });
  });

  render('entree');
})();
</script>
