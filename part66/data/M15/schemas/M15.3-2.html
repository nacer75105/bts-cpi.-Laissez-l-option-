<div id="schema-m1503b-wrap" style="font-family: inherit; max-width: 640px; margin: 0.6em 0 0.2em;">
<style>
#schema-m1503b-wrap .m1503b-btn { margin:4px 6px 4px 0; padding:8px 14px; border-radius:6px; border:1px solid #888; background:#f4f4f4; color:#222; cursor:pointer; font-size:0.9em; }
#schema-m1503b-wrap .m1503b-btn.active { background:#fff3b0; border-color:#e0a800; }
#schema-m1503b-wrap .m1503b-flow { display:flex; align-items:center; gap:8px; margin-top:16px; flex-wrap:wrap; }
#schema-m1503b-wrap .m1503b-box { padding:10px 12px; border-radius:6px; border:1.5px solid #888; background:#f7f7f7; font-size:0.82em; text-align:center; flex:1 1 100px; }
#schema-m1503b-wrap .m1503b-arrow { font-size:1.2em; color:#888; }
#schema-m1503b-wrap .m1503b-caption { margin-top:14px; padding:10px; border-left:4px solid #888; background:rgba(128,128,128,0.10); border-radius:4px; min-height:5.5em; }
</style>

<p><strong>Deux familles de compresseurs :</strong> comparez leur principe de fonctionnement.</p>

<div>
  <button class="m1503b-btn active" data-t="axial">Compresseur axial</button>
  <button class="m1503b-btn" data-t="centrifuge">Compresseur centrifuge</button>
</div>

<div class="m1503b-flow" id="m1503b-flow"></div>

<div class="m1503b-caption" id="m1503b-caption"></div>
</div>

<script>
(function () {
  var wrap = document.getElementById('schema-m1503b-wrap');
  if (!wrap) { return; }
  var btns = wrap.querySelectorAll('.m1503b-btn');
  var flow = wrap.querySelector('#m1503b-flow');
  var caption = wrap.querySelector('#m1503b-caption');

  function renderAxial() {
    flow.innerHTML =
      '<div class="m1503b-box">Air (axe du moteur)</div><div class="m1503b-arrow">→</div>' +
      '<div class="m1503b-box">Rotor 1 + Stator 1</div><div class="m1503b-arrow">→</div>' +
      '<div class="m1503b-box">Rotor 2 + Stator 2 ...</div>';
    caption.textContent = "Compresseur axial : l'air progresse en ligne droite, dans l'axe du moteur, à travers une succession d'étages rotor/stator, chacun ajoutant sa propre contribution à la pression.";
  }

  function renderCentrifuge() {
    flow.innerHTML =
      '<div class="m1503b-box">Air (entrée axiale)</div><div class="m1503b-arrow">→</div>' +
      '<div class="m1503b-box">Rotor tournant (projection radiale, force centrifuge)</div><div class="m1503b-arrow">→</div>' +
      '<div class="m1503b-box">Diffuseur (vitesse → pression)</div>';
    caption.textContent = "Compresseur centrifuge : un disque tournant (rotor, ou « rouet ») projette l'air vers l'extérieur par force centrifuge ; un diffuseur qui l'entoure ralentit ensuite cet air, convertissant sa vitesse en pression.";
  }

  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      btns.forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      if (b.getAttribute('data-t') === 'axial') { renderAxial(); } else { renderCentrifuge(); }
    });
  });

  renderAxial();
})();
</script>
