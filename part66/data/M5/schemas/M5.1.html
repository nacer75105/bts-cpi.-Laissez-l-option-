<div id="schema-m51-wrap" style="font-family: inherit; max-width: 860px; margin: 0.8em 0 0.4em; border:1px solid #ddd; border-radius:12px; padding:18px 22px; background:rgba(128,128,128,0.03);">
<style>
#schema-m51-wrap .m51-btn { padding:8px 16px; border-radius:6px; border:1px solid #888; background:#f4f4f4; color:#222; cursor:pointer; font-size:1em; margin:2px 6px 2px 0; }
#schema-m51-wrap .m51-btn:hover { background:#e8e8e8; }
#schema-m51-wrap .m51-btn.active { background:#333; color:#fff; border-color:#333; }
#schema-m51-wrap .m51-bits { margin-top:14px; display:flex; gap:4px; flex-wrap:wrap; }
#schema-m51-wrap .m51-box { display:inline-flex; flex-direction:column; align-items:center; justify-content:center; width:52px; height:52px; border:2px solid #888; border-radius:8px; font-weight:bold; font-size:1.15em; background:#f7f7f7; color:#222; }
#schema-m51-wrap .m51-box.done { background:#d7f0d7; border-color:#3a9d3a; }
#schema-m51-wrap .m51-box.current { background:#fff3b0; border-color:#e0a800; }
#schema-m51-wrap .m51-pow { font-size:0.48em; font-weight:normal; color:#666; }
#schema-m51-wrap .m51-equation { margin-top:10px; font-family:monospace; font-size:1.02em; min-height:1.5em; }
#schema-m51-wrap .m51-total { font-size:1.2em; font-weight:bold; margin-top:8px; }
#schema-m51-wrap .m51-caption { margin-top:14px; padding:12px; border-left:4px solid #888; background:rgba(128,128,128,0.10); border-radius:4px; font-size:1.02em; min-height:2.6em; }
</style>

<div style="font-size:1.15em; font-weight:bold; margin-bottom:4px;">Conversion binaire → décimal</div>
<p><strong>Essaie toi-même :</strong> choisis un nombre binaire, puis clique sur « Étape suivante » pour le convertir en décimal, bit par bit, en partant de la droite.</p>

<button class="m51-btn" id="m51-preset-a">1010</button>
<button class="m51-btn" id="m51-preset-b">1101</button>
<button class="m51-btn" id="m51-preset-c">11001101</button>

<div class="m51-bits" id="m51-bits"></div>
<div class="m51-equation" id="m51-equation"></div>
<div class="m51-total" id="m51-total">Total : 0</div>

<div style="margin-top:10px;">
  <button class="m51-btn" id="m51-next">Étape suivante ▶</button>
  <button class="m51-btn" id="m51-reset">Recommencer</button>
</div>

<div class="m51-caption" id="m51-caption">Choisis un nombre binaire ci-dessus pour commencer.</div>
</div>

<script>
(function () {
  var wrap = document.getElementById('schema-m51-wrap');
  if (!wrap) { return; }
  var presetA = wrap.querySelector('#m51-preset-a');
  var presetB = wrap.querySelector('#m51-preset-b');
  var presetC = wrap.querySelector('#m51-preset-c');
  var nextBtn = wrap.querySelector('#m51-next');
  var resetBtn = wrap.querySelector('#m51-reset');
  var bitsEl = wrap.querySelector('#m51-bits');
  var equationEl = wrap.querySelector('#m51-equation');
  var totalEl = wrap.querySelector('#m51-total');
  var caption = wrap.querySelector('#m51-caption');
  var SUP = ['⁰', '¹', '²', '³', '⁴', '⁵', '⁶', '⁷', '⁸', '⁹'];

  var bits = [];
  var step = 0;
  var total = 0;
  var terms = [];

  function expo(pos) {
    return '2' + (SUP[pos] || ('^' + pos));
  }

  function renderBits() {
    bitsEl.innerHTML = '';
    for (var i = 0; i < bits.length; i++) {
      var pos = bits.length - 1 - i;
      var box = document.createElement('div');
      box.className = 'm51-box';
      if (pos < step - 1) { box.className = 'm51-box done'; }
      if (pos === step - 1) { box.className = 'm51-box current'; }
      box.innerHTML = bits[i] + '<span class="m51-pow">' + expo(pos) + '</span>';
      bitsEl.appendChild(box);
    }
  }

  function loadBinary(bin) {
    bits = bin.split('');
    step = 0;
    total = 0;
    terms = [];
    renderBits();
    totalEl.textContent = 'Total : 0';
    equationEl.textContent = '';
    caption.textContent = 'Nombre binaire ' + bin + ' choisi. Clique sur « Étape suivante » : on l\'examine bit par bit, en commençant par celui de droite (position 2^0).';
  }

  function nextStep() {
    if (bits.length === 0) {
      caption.textContent = 'Choisis d\'abord un nombre binaire ci-dessus.';
      return;
    }
    if (step >= bits.length) {
      caption.textContent = 'Conversion déjà terminée : ' + bits.join('') + '(2) = ' + total + '(10). Clique sur « Recommencer » pour la revoir.';
      return;
    }
    var pos = step;
    var idx = bits.length - 1 - pos;
    var bitVal = bits[idx];
    var powVal = Math.pow(2, pos);
    var msg;
    if (bitVal === '1') {
      total = total + powVal;
      msg = 'Bit en position ' + expo(pos) + ' : il vaut 1, donc on ajoute ' + expo(pos) + ' = ' + powVal + '. Total actuel : ' + total + '.';
    } else {
      msg = 'Bit en position ' + expo(pos) + ' : il vaut 0, on n\'ajoute rien. Total actuel : ' + total + '.';
    }
    terms.unshift(bitVal + '×' + expo(pos));
    step = step + 1;
    renderBits();
    totalEl.textContent = 'Total : ' + total;
    equationEl.textContent = terms.join(' + ') + (step === bits.length ? (' = ' + total) : '');
    if (step === bits.length) {
      msg = msg + ' Conversion terminée : ' + bits.join('') + '(2) = ' + total + '(10).';
    }
    caption.textContent = msg;
  }

  presetA.addEventListener('click', function () { loadBinary('1010'); });
  presetB.addEventListener('click', function () { loadBinary('1101'); });
  presetC.addEventListener('click', function () { loadBinary('11001101'); });
  nextBtn.addEventListener('click', nextStep);
  resetBtn.addEventListener('click', function () { if (bits.length) { loadBinary(bits.join('')); } });

  loadBinary('1010');
})();
</script>
