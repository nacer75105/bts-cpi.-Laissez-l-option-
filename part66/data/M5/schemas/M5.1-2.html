<div id="schema-m51b-wrap" style="font-family: inherit; max-width: 860px; margin: 0.8em 0 0.4em; border:1px solid #ddd; border-radius:12px; padding:18px 22px; background:rgba(128,128,128,0.03);">
<style>
#schema-m51b-wrap .m51b-btn { padding:8px 16px; border-radius:6px; border:1px solid #888; background:#f4f4f4; color:#222; cursor:pointer; font-size:1em; margin:2px 6px 2px 0; }
#schema-m51b-wrap .m51b-btn:hover { background:#e8e8e8; }
#schema-m51b-wrap .m51b-groups { margin-top:14px; display:flex; gap:6px; flex-wrap:wrap; }
#schema-m51b-wrap .m51b-box { display:inline-flex; flex-direction:column; align-items:center; justify-content:center; min-width:56px; height:52px; padding:0 6px; border:2px solid #888; border-radius:8px; font-family:monospace; font-weight:bold; font-size:1em; background:#f7f7f7; color:#222; }
#schema-m51b-wrap .m51b-box.done { background:#d7f0d7; border-color:#3a9d3a; }
#schema-m51b-wrap .m51b-hex { font-size:0.62em; font-weight:normal; color:#666; }
#schema-m51b-wrap .m51b-note { margin-top:8px; font-size:0.85em; color:#666; font-style:italic; }
#schema-m51b-wrap .m51b-caption { margin-top:14px; padding:12px; border-left:4px solid #888; background:rgba(128,128,128,0.10); border-radius:4px; font-size:1.02em; min-height:2.6em; }
</style>

<div style="font-size:1.15em; font-weight:bold; margin-bottom:4px;">Conversion binaire → hexadécimal</div>
<p><strong>Essaie toi-même :</strong> choisis un nombre binaire, puis clique sur « Étape suivante » pour le regrouper par quartets (4 bits) et le convertir en hexadécimal.</p>

<button class="m51b-btn" id="m51b-preset-a">10101100</button>
<button class="m51b-btn" id="m51b-preset-b">1101101</button>
<button class="m51b-btn" id="m51b-preset-c">11110000</button>

<div class="m51b-note" id="m51b-note"></div>
<div class="m51b-groups" id="m51b-groups"></div>

<div style="margin-top:10px;">
  <button class="m51b-btn" id="m51b-next">Étape suivante ▶</button>
  <button class="m51b-btn" id="m51b-reset">Recommencer</button>
</div>

<div class="m51b-caption" id="m51b-caption">Choisis un nombre binaire ci-dessus pour commencer.</div>
</div>

<script>
(function () {
  var wrap = document.getElementById('schema-m51b-wrap');
  if (!wrap) { return; }
  var presetA = wrap.querySelector('#m51b-preset-a');
  var presetB = wrap.querySelector('#m51b-preset-b');
  var presetC = wrap.querySelector('#m51b-preset-c');
  var nextBtn = wrap.querySelector('#m51b-next');
  var resetBtn = wrap.querySelector('#m51b-reset');
  var groupsEl = wrap.querySelector('#m51b-groups');
  var noteEl = wrap.querySelector('#m51b-note');
  var caption = wrap.querySelector('#m51b-caption');
  var HEX = '0123456789ABCDEF';

  var groups = [];
  var revealed = 0;
  var original = '';
  var padCount = 0;

  function computeGroups(bin) {
    var padded = bin;
    var rem = padded.length % 4;
    var pad = 0;
    if (rem !== 0) {
      pad = 4 - rem;
      for (var p = 0; p < pad; p++) { padded = '0' + padded; }
    }
    var g = [];
    for (var i = 0; i < padded.length; i = i + 4) { g.push(padded.substr(i, 4)); }
    return { groups: g, padCount: pad };
  }

  function render() {
    var html = '';
    for (var i = 0; i < groups.length; i++) {
      var val = parseInt(groups[i], 2);
      var hexDigit = revealed > i ? HEX[val] : '?';
      var cls = revealed > i ? 'm51b-box done' : 'm51b-box';
      html = html + '<div class="' + cls + '">' + groups[i] + '<span class="m51b-hex">' + hexDigit + '</span></div>';
    }
    groupsEl.innerHTML = html;
  }

  function load(bin) {
    original = bin;
    var res = computeGroups(bin);
    groups = res.groups;
    padCount = res.padCount;
    revealed = 0;
    render();
    if (padCount > 0) {
      noteEl.textContent = 'Le nombre d\'origine (' + bin + ', ' + bin.length + ' bits) n\'est pas un multiple de 4 : ' + padCount + (padCount > 1 ? ' zéros ont été ajoutés' : ' zéro a été ajouté') + ' devant, pour former le groupe de gauche.';
    } else {
      noteEl.textContent = '';
    }
    caption.textContent = 'Nombre binaire ' + bin + ' choisi, regroupé par 4 bits en partant de la droite. Clique sur « Étape suivante » pour convertir chaque groupe.';
  }

  function next() {
    if (groups.length === 0) {
      caption.textContent = 'Choisis d\'abord un nombre binaire ci-dessus.';
      return;
    }
    if (revealed >= groups.length) {
      var hex = '';
      for (var i = 0; i < groups.length; i++) { hex = hex + HEX[parseInt(groups[i], 2)]; }
      caption.textContent = 'Conversion déjà terminée : ' + original + '(2) = ' + hex + '(16).';
      return;
    }
    revealed = revealed + 1;
    render();
    var g = groups[revealed - 1];
    var val = parseInt(g, 2);
    if (revealed === groups.length) {
      var hexFull = '';
      for (var j = 0; j < groups.length; j++) { hexFull = hexFull + HEX[parseInt(groups[j], 2)]; }
      caption.textContent = 'Dernier groupe ' + g + ' = ' + val + ' = ' + HEX[val] + '. Résultat complet : ' + original + '(2) = ' + hexFull + '(16).';
    } else {
      caption.textContent = 'Groupe ' + g + ' = ' + val + ' en décimal = ' + HEX[val] + ' en hexadécimal.';
    }
  }

  presetA.addEventListener('click', function () { load('10101100'); });
  presetB.addEventListener('click', function () { load('1101101'); });
  presetC.addEventListener('click', function () { load('11110000'); });
  nextBtn.addEventListener('click', next);
  resetBtn.addEventListener('click', function () { if (original) { load(original); } });

  load('10101100');
})();
</script>
